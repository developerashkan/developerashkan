name: Refresh profile

on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours: new stars, repos, pushes and pub.dev releases show up the same day
  workflow_dispatch:
  repository_dispatch: # lets other repos trigger a refresh right after a release
    types: [refresh-profile]
  watch: # someone starred this repo
    types: [started]
  push:
    branches: [main, master]
    paths:
      - "scripts/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVG assets
        run: python scripts/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets scripts/cache.json README.md
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh profile assets [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
            git push
          fi
