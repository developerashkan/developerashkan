<stop offset="0" stop-color="#22D3EE"/><stop offset="0.5" stop-color="#A78BFA"/><stop offset="1" stop-color="#F472B6"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1000 0" dur="10s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="h" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#A78BFA" stop-opacity="0.18"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
