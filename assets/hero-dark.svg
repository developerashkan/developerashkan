.ph{opacity:0;animation:ph 16s ease-in-out infinite backwards}@keyframes ph{0%{opacity:0;transform:translateY(10px)}3.0%,21.2%{opacity:1;transform:translateY(0)}25.0%,100%{opacity:0;transform:translateY(-10px)}}@media (prefers-reduced-motion: reduce){.ph0{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.rm-hide{display:none}.rm-show{display:inline!important}}
